<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NutriGirl AI - Simple Camera</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica', 'Arial', sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #FFB6C1, #FFD1DC);
            min-height: 100vh;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }
        
        h1 {
            text-align: center;
            color: #FF1493;
            margin-bottom: 30px;
        }
        
        .camera-section {
            text-align: center;
            margin-bottom: 30px;
        }
        
        #cameraVideo {
            width: 100%;
            max-width: 640px;
            height: 480px;
            border-radius: 15px;
            border: 3px solid #FF1493;
            background: #f0f0f0;
        }
        
        .controls {
            margin: 20px 0;
        }
        
        button {
            background: linear-gradient(135deg, #FF1493, #FF69B4);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            margin: 0 10px;
            transition: all 0.3s ease;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 20, 147, 0.4);
        }
        
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        
        .result-section {
            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 15px;
            border: 2px solid #FF1493;
        }
        
        .loading {
            text-align: center;
            color: #FF1493;
            font-size: 18px;
        }
        
        .error {
            color: #dc3545;
            text-align: center;
            font-size: 16px;
        }
        
        .success {
            color: #28a745;
            text-align: center;
            font-size: 16px;
        }
        
        .analysis-result {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-top: 15px;
        }
        
        .nutrition-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }
        
        .nutrition-item {
            display: flex;
            justify-content: space-between;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 8px;
            border-left: 4px solid #FF1493;
        }
        
        .nutrition-item .label {
            font-weight: 600;
            color: #333;
        }
        
        .nutrition-item .value {
            color: #FF1493;
            font-weight: 700;
        }
        
        .rating {
            background: linear-gradient(135deg, #FF1493, #FF69B4);
            color: white;
            padding: 5px 10px;
            border-radius: 15px;
            font-weight: 700;
        }
        
        .recommendations {
            margin-top: 20px;
            padding: 15px;
            background: #e8f5e8;
            border-radius: 8px;
            border-left: 4px solid #28a745;
        }
        
        .recommendations h4 {
            color: #28a745;
            margin-top: 0;
        }
        
        .action-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 20px;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #28a745, #20c997);
        }
        
        .btn-secondary {
            background: linear-gradient(135deg, #ffc107, #fd7e14);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🍎 NutriGirl AI - Food Analysis</h1>
        
        <div class="camera-section">
            <video id="cameraVideo" autoplay muted playsinline></video>
            
            <div class="controls">
                <button id="startCameraBtn" onclick="startCamera()">📷 Start Camera</button>
                <button id="captureBtn" onclick="captureFood()" style="display: none;">📸 Capture & Analyze</button>
                <button id="stopCameraBtn" onclick="stopCamera()" style="display: none;">⏹️ Stop Camera</button>
            </div>
        </div>
        
        <div class="result-section">
            <h3>Analysis Result</h3>
            <div id="analysisResult">
                <p style="text-align: center; color: #666;">Start your camera and capture a photo of your food to get AI-powered nutritional analysis!</p>
            </div>
        </div>
    </div>

    <script>
        // OpenAI API configuration
        const OPENAI_API_KEY = 'YOUR_OPENAI_API_KEY_HERE';

        let currentStream = null;

        // Camera functionality
        async function startCamera() {
            try {
                const video = document.getElementById('cameraVideo');
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { width: 640, height: 480 } 
                });
                
                video.srcObject = stream;
                currentStream = stream;
                
                document.getElementById('startCameraBtn').style.display = 'none';
                document.getElementById('captureBtn').style.display = 'inline-block';
                document.getElementById('stopCameraBtn').style.display = 'inline-block';
                
            } catch (error) {
                console.error('Error accessing camera:', error);
                alert('Could not access camera. Please check permissions.');
            }
        }

        function stopCamera() {
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
                currentStream = null;
            }
            
            const video = document.getElementById('cameraVideo');
            video.srcObject = null;
            
            document.getElementById('startCameraBtn').style.display = 'inline-block';
            document.getElementById('captureBtn').style.display = 'none';
            document.getElementById('stopCameraBtn').style.display = 'none';
        }

        async function captureFood() {
            const video = document.getElementById('cameraVideo');
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            ctx.drawImage(video, 0, 0);
            
            const imageData = canvas.toDataURL('image/jpeg', 0.8);
            
            // Show loading
            const resultDiv = document.getElementById('analysisResult');
            resultDiv.innerHTML = '<div class="loading">🔍 Analyzing your food...</div>';
            
            try {
                const analysis = await analyzeFoodWithOpenAI(imageData);
                displayFoodAnalysis(analysis);
            } catch (error) {
                console.error('Error analyzing food:', error);
                resultDiv.innerHTML = '<div class="error">❌ Error analyzing food. Please try again.</div>';
            }
        }

        // Analyze food with OpenAI
        async function analyzeFoodWithOpenAI(imageData) {
            const response = await fetch('https://api.openai.com/v1/chat/completions', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${OPENAI_API_KEY}`
                },
                body: JSON.stringify({
                    model: "gpt-4o",
                    messages: [
                        {
                            role: "user",
                            content: [
                                {
                                    type: "text",
                                    text: "Analyze this food image for a woman with PCOS. Provide: 1) Food name, 2) Estimated calories, 3) Sugar content, 4) Carbohydrate content, 5) Protein content, 6) Fat content, 7) PCOS-friendly rating (1-10), 8) Health recommendations. Format as JSON with keys: food_name, calories, sugar, carbs, protein, fat, pcos_rating, recommendations."
                                },
                                {
                                    type: "image_url",
                                    image_url: {
                                        url: imageData
                                    }
                                }
                            ]
                        }
                    ],
                    max_tokens: 500,
                    temperature: 0.7
                })
            });

            if (!response.ok) {
                throw new Error(`OpenAI API error: ${response.status}`);
            }

            const data = await response.json();
            return JSON.parse(data.choices[0].message.content);
        }

        // Display food analysis
        function displayFoodAnalysis(analysis) {
            const resultDiv = document.getElementById('analysisResult');
            
            resultDiv.innerHTML = `
                <div class="analysis-result">
                    <h3>🍽️ ${analysis.food_name}</h3>
                    <div class="nutrition-grid">
                        <div class="nutrition-item">
                            <span class="label">Calories:</span>
                            <span class="value">${analysis.calories}</span>
                        </div>
                        <div class="nutrition-item">
                            <span class="label">Sugar:</span>
                            <span class="value">${analysis.sugar}g</span>
                        </div>
                        <div class="nutrition-item">
                            <span class="label">Carbs:</span>
                            <span class="value">${analysis.carbs}g</span>
                        </div>
                        <div class="nutrition-item">
                            <span class="label">Protein:</span>
                            <span class="value">${analysis.protein}g</span>
                        </div>
                        <div class="nutrition-item">
                            <span class="label">Fat:</span>
                            <span class="value">${analysis.fat}g</span>
                        </div>
                        <div class="nutrition-item">
                            <span class="label">PCOS Rating:</span>
                            <span class="value rating">${analysis.pcos_rating}/10</span>
                        </div>
                    </div>
                    <div class="recommendations">
                        <h4>💡 Recommendations:</h4>
                        <p>${analysis.recommendations}</p>
                    </div>
                    <div class="action-buttons">
                        <button class="btn-primary" onclick="saveFoodLog('${analysis.food_name}', ${analysis.calories}, ${analysis.sugar}, ${analysis.carbs}, ${analysis.protein}, ${analysis.fat}, ${analysis.pcos_rating})">✅ Save as Healthy</button>
                        <button class="btn-secondary" onclick="flagFoodLog('${analysis.food_name}', ${analysis.calories}, ${analysis.sugar}, ${analysis.carbs}, ${analysis.protein}, ${analysis.fat}, ${analysis.pcos_rating})">⚠️ Flag for Review</button>
                    </div>
                </div>
            `;
        }

        // Save food log
        function saveFoodLog(food, calories, sugar, carbs, protein, fat, rating) {
            const foodLog = {
                id: Date.now(),
                timestamp: new Date().toISOString(),
                food: food,
                nutrition: {
                    calories: calories,
                    sugar: sugar,
                    carbs: carbs,
                    protein: protein,
                    fat: fat
                },
                pcosRating: rating,
                mealType: 'meal',
                flagged: false,
                healthy: true
            };
            
            // Save to localStorage
            const existingLogs = JSON.parse(localStorage.getItem('nutrigirl_food_logs') || '[]');
            existingLogs.push(foodLog);
            localStorage.setItem('nutrigirl_food_logs', JSON.stringify(existingLogs));
            
            alert('✅ Food logged successfully!');
        }

        // Flag food log
        function flagFoodLog(food, calories, sugar, carbs, protein, fat, rating) {
            const foodLog = {
                id: Date.now(),
                timestamp: new Date().toISOString(),
                food: food,
                nutrition: {
                    calories: calories,
                    sugar: sugar,
                    carbs: carbs,
                    protein: protein,
                    fat: fat
                },
                pcosRating: rating,
                mealType: 'meal',
                flagged: true,
                healthy: false
            };
            
            // Save to localStorage
            const existingLogs = JSON.parse(localStorage.getItem('nutrigirl_food_logs') || '[]');
            existingLogs.push(foodLog);
            localStorage.setItem('nutrigirl_food_logs', JSON.stringify(existingLogs));
            
            alert('⚠️ Food flagged for review!');
        }
    </script>
</body>
</html>
